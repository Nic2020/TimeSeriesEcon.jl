name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run for the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write  # lets julia-actions/cache delete old caches

jobs:
  build:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}${{ matrix.experimental && ' (allowed to fail)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # The prerelease job is an early warning only; it does not fail the run.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        julia-version: ["lts", "1.12", "1"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        experimental: [false]
        include:
          - julia-version: "pre"
            os: ubuntu-latest
            experimental: true

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          show-versioninfo: true

      - uses: julia-actions/cache@v3

      - uses: julia-actions/julia-runtest@v1
        with:
          depwarn: error

      - uses: julia-actions/julia-processcoverage@v1

      # Coverage is advisory: an upload problem never fails the job.
      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
